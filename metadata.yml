Title: N.gonorrhoeae antimicrobial activity
Description: Scores small molecules for growth inhibition of Neisseria gonorrhoeae,
  now resistant to every antibiotic class deployed against it. Anahtar and colleagues
  tested 38,650 compounds at 50 uM against strain ATCC 49226, spanning the Pharmakon
  library of 1755 approved drugs and an internal 37K collection, and trained a directed
  message-passing neural network. Served here is their round 2 model, retrained on
  validated hits, which rescreened the Broad 800K library and surfaced compound A1,
  active in a mouse vaginal infection model.
