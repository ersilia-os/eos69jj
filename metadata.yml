Title: N.gonorrhoeae antimicrobial activity
Description: Predicts growth inhibition of Neisseria gonorrhoeae, where resistance
  has eroded treatment options to the point that untreatable infection is a realistic
  prospect. Anahtar and colleagues screened compounds against the organism, trained
  graph neural networks on the results, and applied them across large virtual libraries.
  Predicted actives were synthesised and tested, yielding compounds effective in a
  mouse infection model, which places this among the antibacterial models with prospective
  experimental support.
